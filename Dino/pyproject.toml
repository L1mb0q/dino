[project]
name = "dino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",
]

[project.scripts]
dino = "dino:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-playwright>=0.5.2",
]
